[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fido2-course-experiments"
version = "0.1.0"
description = "Reproducible experiments over pinned historical FIDO2Verif models"
requires-python = ">=3.10"
dependencies = ["PyYAML==6.0.2"]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
report = ["python-docx==1.1.2", "matplotlib==3.10.1", "PyMuPDF==1.26.6"]

[project.scripts]
fido2-experiments = "experiment_manager.cli:main"

[tool.setuptools.packages.find]
include = ["experiment_manager*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
